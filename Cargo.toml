[workspace]
members = [
    "apps/cli",
    "apps/desktop",
    "apps/sfx-stub",
    "apps/installer",
    "crates/xrar-core",
    "crates/xrar-format",
    "crates/xrar-compression",
    "crates/xrar-codecs",
    "crates/xrar-crypto",
    "crates/xrar-filesystem",
    "crates/xrar-extractor",
    "crates/xrar-archive",
    "crates/xrar-recovery",
    "crates/xrar-dedup",
    "crates/xrar-benchmark",
    "crates/xrar-plugin-api",
]
resolver = "2"

[workspace.package]
version = "1.0.0"
authors = ["En-Dhiaa <en-dhiaa@users.noreply.github.com>"]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/En-Dhiaa/xrar"
keywords = ["archive", "compression", "xrar", "winrar-alternative", "7zip"]
categories = ["compression", "command-line-utilities", "filesystem"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
sha2 = "0.10"
blake3 = "1.5"
aes-gcm = "0.10"
argon2 = "0.5"
zeroize = { version = "1.8", features = ["derive"] }
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
lz4_flex = "0.11"
lzma-rs = "0.3"
brotli = "7.0"
zip = { version = "2.2", default-features = false, features = ["deflate", "time"] }
tar = "0.4"
clap = { version = "4.5", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
rand = "0.8"
reed-solomon-erasure = "6.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rayon = "1.10"
